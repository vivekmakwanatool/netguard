<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetGuard Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="center"><main class="card login-card"><div class="brand">◉ NetGuard</div><h1>Sign in</h1><p class="muted">Authorized security testing dashboard</p>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><small class="muted">For lab and authorized testing only.</small></main></body></html>
