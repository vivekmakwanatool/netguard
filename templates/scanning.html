<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3;url={{ url_for('results', scan_id=scan.id) }}"><title>Scanning — NetGuard</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="center"><section class="card progress-card"><div class="brand">◉ NetGuard</div><h1>Scan in progress</h1><p class="muted">Target: {{ scan.target }}</p><div class="progress"><div id="bar"></div></div><p id="status" class="status">Starting…</p><p class="muted">The page will open the report when the scan finishes.</p></section></main><script>async function poll(){try{const r=await fetch('{{ url_for('api_progress', scan_id=scan.id) }}');const d=await r.json();const total=d.total||1;document.getElementById('bar').style.width=Math.min(100,(d.done/total)*100)+'%';document.getElementById('status').textContent=d.status+' — '+d.done+'/'+total;if(d.status==='completed'||d.status==='failed')location.href='{{ url_for('results', scan_id=scan.id) }}';}catch(e){}setTimeout(poll,1000)}poll();</script></body></html>
